[package]
name = "prism-agent"
version = "0.1.0"
description = "Rust-powered AI Agent Platform"
authors = ["Prism Team"]
edition = "2021"

[lib]
name = "prism_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio-util = "0.7"
tokio-tungstenite = "0.24"
http = "1"
urlencoding = "2"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
mime_guess = "2"
regex = "1"
tar = "0.4"
bzip2 = "0.4"
sha2 = "0.10"
pdf-extract = "0.12"
