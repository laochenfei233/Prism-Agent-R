[package]
name = "prism-agent"
version = "0.1.0"
description = "Rust-powered AI Agent Platform"
authors = ["Prism Team"]
edition = "2021"

[lib]
name = "prism_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# sherpa-rs 本地推理（SenseVoice/Paraformer/Whisper onnx）为可选能力：
# 启用需要本机 libclang（bindgen 编译）+ 网络下载 onnxruntime 预编译库（约 200MB）。
# 默认关闭——应用核心（Agent/Wiki/RAG/会议云端 ASR/翻译/OCR 等）不依赖它即可构建运行，
# SherpaOnnx 后端降级为模型路径校验骨架（提示安装模型与启用该 feature）。
sherpa-native = ["dep:sherpa-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio-util = "0.7"
tokio-tungstenite = "0.24"
http = "1"
urlencoding = "2"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"], optional = true }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
mime_guess = "2"
regex = "1"
tar = "0.4"
bzip2 = "0.4"
sha2 = "0.10"
pdf-extract = "0.12"
