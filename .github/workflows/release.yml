# Release: runs on push to master/main. The quality gates live in build.yml's
# `test` job — with branch protection marking `test` as a required check, a
# release only happens for changes that passed the full gate. If branch
# protection is not enabled, consider switching this to `workflow_run` on the
# build workflow to keep the "tests passed before release" guarantee.
name: Release

on:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semantic-release needs full history for commit analysis
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system deps
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=60
          sudo apt-get install -y -o Acquire::Retries=5 libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run semantic-release (version + CHANGELOG + git tag)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
