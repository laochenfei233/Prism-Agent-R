name: Build

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

permissions:
  contents: write

jobs:
  # 测试与 RAG 评测回归门槛（§10.2.5）：cargo test 含 eval_gate_meets_baselines，
  # 低于基线即失败。test job 失败时 build 不运行、PR 检查变红；
  # 建议在分支保护中将 test 设为 required check 以硬性拦截合并。
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # sherpa-rs-sys 的 download-binaries 把库解压到 ~/.cache/sherpa-rs；
          # 必须与构建产物一同缓存，否则缓存恢复后 build script 跳过下载但库缺失 → 链接失败
          cache-directories: |
            ~/.cache/sherpa-rs

      - name: Install system deps
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=60
          sudo apt-get install -y -o Acquire::Retries=5 libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libclang-14-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests (含 RAG 五维评测回归门槛)
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          LIBCLANG_PATH: /usr/lib/llvm-14/lib

      - name: SvelteKit sync (生成 .svelte-kit 类型文件，svelte-check 依赖)
        run: npx svelte-kit sync

      - name: Svelte type check
        run: npx svelte-check --output machine

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-directories: |
            ~/.cache/sherpa-rs

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=60
          sudo apt-get install -y -o Acquire::Retries=5 libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libclang-14-dev rpm \
            libfuse2

      - name: Install frontend dependencies
        run: npm ci

      # LIBCLANG_PATH 是平台特定路径：写 Linux 专用的 .cargo/config.toml（与本机做法一致），
      # 不能放进共享 env——Windows/macOS runner 上不存在 /usr/lib/llvm-14/lib，bindgen 会失败
      - name: Configure LIBCLANG_PATH (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/.cargo
          printf '[env]\nLIBCLANG_PATH = "/usr/lib/llvm-14/lib"\n' > src-tauri/.cargo/config.toml

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prism-agent-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
